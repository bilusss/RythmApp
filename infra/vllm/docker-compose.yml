# Bielik-11B-v3.1 (FP8) served by vLLM on the RTX 5070 Ti PC (16 GB VRAM).
# OpenAI-compatible API: http://<host>:8000/v1  (model name: "bielik")
# Settings live in .env (see .env.example). Start: ./vllm.sh up
services:
  vllm:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-latest}
    container_name: rythm-vllm
    restart: unless-stopped
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_HUB_OFFLINE=1          # weights are downloaded beforehand, no network at start
    # Bind only to VLLM_BIND_IP: 127.0.0.1 for local tests, the Tailscale IP (100.x.y.z) in production.
    ports:
      - "${VLLM_BIND_IP:-127.0.0.1}:${VLLM_PORT:-8000}:8000"
    # Memory: weights 11.4 GB; FP8 KV cache = ~100 KB/token, so 16k context fits inside 0.90 of 16 GB.
    command: >
      --model speakleash/Bielik-11B-v3.1-Instruct-FP8-Dynamic
      --served-model-name bielik
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.90}
      --kv-cache-dtype fp8
      --max-num-seqs 4
      --generation-config auto
      --api-key ${BIELIK_API_KEY:?set BIELIK_API_KEY in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 600s
      retries: 3
